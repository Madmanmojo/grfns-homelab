services:
  radarr-mac:
    image: ghcr.io/linuxserver/radarr:latest
    container_name: radarr-mac
    environment:
      - PUID=501  # Your Mac user ID (jarvis)
      - PGID=20   # staff group
      - TZ=America/New_York
      - UMASK=002
    volumes:
      - /Volumes/Orange/docker/arr-stack/config/radarr:/config
      - /Volumes/MediaStorage/Movies:/movies  # RW so Radarr can write metadata/links
      - /Volumes/MediaStorage:/media  # RW for future needs
    ports:
      - "7878:7878"  # Mac Radarr on 7878 (seedbox uses 7879 via tunnel)
    restart: unless-stopped
    networks:
      - arr-network
    # Install ffmpeg on container startup (needed for media parsing)
    command: >
      sh -c "apk add --no-cache ffmpeg > /dev/null 2>&1 || true &&
             /init"

  sonarr-mac:
    image: ghcr.io/linuxserver/sonarr:latest
    container_name: sonarr-mac
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/New_York
      - UMASK=002
    volumes:
      - /Volumes/Orange/docker/arr-stack/config/sonarr:/config
      - /Volumes/MediaStorage/TV:/tv  # RW
      - /Volumes/MediaStorage:/media  # RW
    ports:
      - "8989:8989"  # Mac Sonarr on 8989 (seedbox uses 8990 via tunnel)
    restart: unless-stopped
    networks:
      - arr-network

  # Whisparr - commented out due to registry issues, can be added later
  # whisparr-mac:
  #   image: ghcr.io/linuxserver/whisparr:latest
  #   container_name: whisparr-mac
  #   environment:
  #     - PUID=501
  #     - PGID=20
  #     - TZ=America/New_York
  #     - UMASK=002
  #   volumes:
  #     - /Volumes/Orange/docker/arr-stack/config/whisparr:/config
  #     - /Volumes/MediaStorage/Adult:/adult:ro
  #     - /Volumes/MediaStorage:/media:ro
  #   ports:
  #     - "6969:6969"  # Mac Whisparr on 6969 (seedbox uses 6970 via tunnel)
  #   restart: unless-stopped
  #   networks:
  #     - arr-network

  kapowarr:
    image: mrcas/kapowarr:latest
    container_name: kapowarr
    restart: unless-stopped
    ports:
      - "7595:5656"
    volumes:
      - /Users/jarvis/.kapowarr:/app/db
      - /Volumes/MediaStorage/Comics:/comics:rw
      - /Volumes/MediaStorage/syncthing-incoming/Media:/import:rw
    networks:
      - arr-network

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      - PUID=501
      - PGID=20
      - TZ=America/New_York
    volumes:
      - /Volumes/Orange/docker/arr-stack/config/jellyseerr:/app/config
    ports:
      - "127.0.0.1:5055:5055"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - arr-network

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=America/New_York
    ports:
      - "127.0.0.1:8191:8191"
    restart: unless-stopped
    networks:
      - arr-network

networks:
  arr-network:
    driver: bridge

