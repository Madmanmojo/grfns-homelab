x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  audiobookshelf:
    image: advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    volumes:
      - ./config:/config
      - ./metadata:/metadata
      - /Volumes/MediaStorage/Books/Audiobooks:/audiobooks
    ports:
      - "127.0.0.1:13378:80"
    logging: *default-logging
