# Komga - comics server (OPDS for Panels)
# Komf - metadata fetcher (Comic Vine, series matching)
# Comics library: /Volumes/Orange/Comics

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  komga:
    image: gotson/komga:latest
    container_name: komga
    restart: unless-stopped
    environment:
      - TZ=America/New_York
    ports:
      - "127.0.0.1:25600:25600"  # loopback only — public access via Caddy/Authelia at read.grfns.com
    volumes:
      - /Users/jarvis/.komga/config:/config
      - /Users/jarvis/.komga/data:/data
      # Comics library - read-write so Komga can update metadata / write back to files
      - /Volumes/MediaStorage/Comics:/comics
      # Optional: import folder (read-only is fine)
      - /Volumes/MediaStorage/syncthing-incoming/Media:/import:ro
    extra_hosts:
      - "auth.grfns.com:172.23.0.4"
    networks:
      - komga-net
      - authelia_proxy-net
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 2G  # Java app, can spike during library scans

networks:
  komga-net:
    name: komga_default  # matches the external name Caddy expects in arr-stack
    driver: bridge
  authelia_proxy-net:
    external: true
