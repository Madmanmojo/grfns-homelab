access_control:
  default_policy: deny

  rules:
    # Authelia portal itself — always bypass
    - domain: auth.grfns.com
      policy: bypass

    # Admin (you) — full access to everything
    - domain:
        - "watch.grfns.com"
        - "read.grfns.com"
        - "requests.grfns.com"
        - "media.grfns.com"
        - "play.grfns.com"
      subject: "group:admins"
      policy: one_factor

    # Friends group — can watch and request, not play or read
    - domain:
        - "watch.grfns.com"
        - "requests.grfns.com"
      subject: "group:friends"
      policy: one_factor

    # Readers group — comics only
    - domain: "read.grfns.com"
      subject: "group:readers"
      policy: one_factor
