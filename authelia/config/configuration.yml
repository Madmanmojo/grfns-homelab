---
theme: dark

server:
  address: tcp://0.0.0.0:9091

log:
  level: info
  format: json
  file_path: /config/authelia.log
  keep_stdout: true

# Secrets loaded from environment variables (AUTHELIA_JWT_SECRET, etc.)

authentication_backend:
  ldap:
    address: ldap://lldap:3890
    base_dn: dc=grfns,dc=com
    additional_users_dn: ou=people
    users_filter: (&({username_attribute}={input})(objectClass=person))
    additional_groups_dn: ou=groups
    groups_filter: (member={dn})
    user: uid=admin,ou=people,dc=grfns,dc=com
    attributes:
      username: uid
      group_name: cn
      mail: mail
      display_name: displayName

session:
  name: authelia_session
  expiration: 12h
  inactivity: 1h
  remember_me: 1M
  cookies:
    - domain: grfns.com
      authelia_url: https://auth.grfns.com
      default_redirection_url: https://watch.grfns.com
      same_site: lax

storage:
  local:
    path: /config/db/authelia.db

notifier:
  # Writes verification codes/reset links to a local file.
  # Read with: cat /Users/jarvis/docker/authelia/config/notification.txt
  # Upgrade to SMTP later for email delivery.
  filesystem:
    filename: /config/notification.txt

