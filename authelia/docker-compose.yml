x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  lldap:
    image: lldap/lldap:stable
    container_name: lldap
    restart: unless-stopped
    environment:
      - TZ=America/New_York
      - LLDAP_JWT_SECRET=${LLDAP_JWT_SECRET}
      - LLDAP_LDAP_USER_PASS=${LLDAP_ADMIN_PASSWORD}
      - LLDAP_LDAP_BASE_DN=dc=grfns,dc=com
      - LLDAP_LDAP_USER_DN=admin
    volumes:
      - lldap_data:/data
    ports:
      - "127.0.0.1:17170:17170"
    networks:
      - proxy-net
    logging: *default-logging

  authelia:
    image: authelia/authelia:4.39.16
    container_name: authelia
    restart: unless-stopped
    environment:
      - TZ=America/New_York
      - AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET=${AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET}
      - AUTHELIA_SESSION_SECRET=${SESSION_SECRET}
      - AUTHELIA_STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY}
      - AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD=${LLDAP_ADMIN_PASSWORD}
      - AUTHELIA_NOTIFIER_SMTP_PASSWORD=${SMTP_PASSWORD}
    volumes:
      - ./config:/config
    ports:
      - "127.0.0.1:9091:9091"
    networks:
      - proxy-net
    logging: *default-logging

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: caddy
    restart: unless-stopped
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "127.0.0.1:80:80"
      - "192.168.1.3:80:80"
      - "192.168.1.3:443:443"
      - "192.168.1.3:443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy-net
    logging: *default-logging

networks:
  proxy-net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  lldap_data:
